# Local Mosquitto broker for MQTTDashboard (development only - no password!)
# Run: start-broker.bat
#
# The Windows "mosquitto" service already uses 127.0.0.1:1883,
# so this broker uses different ports.

per_listener_settings false
allow_anonymous true

# XIAO board (plain MQTT over TCP, reachable from the LAN)
listener 1884 0.0.0.0

# Web dashboard (MQTT over WebSockets for the browser)
listener 9001 0.0.0.0
protocol websockets

log_type error
log_type warning
log_type notice
log_type information
connection_messages true
